name: Street imagery check
on:
  push:
    paths: ['.github/workflows/street-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  street:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test the actual street and alternate open imagery
        run: |
          mkdir -p /tmp/street-check
          cd /tmp/street-check
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          cat > probe.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1280,height:800},locale:'en-US'});
            const points=[
              ['north',25.59280,-108.47156],
              ['block2',25.59194,-108.47114],
              ['middle',25.59097,-108.47070],
              ['block4',25.590124,-108.4702804],
              ['south',25.58935,-108.46988],
              ['control-guasave',25.57452,-108.46875]
            ];
            const results=[];
            for(const [name,lat,lng] of points){
              const page=await context.newPage();
              try{
                await page.goto(`https://www.google.com/maps/@${lat},${lng},3a,75y,335h,90t/data=!3m1!1e1?hl=en`,{waitUntil:'domcontentloaded',timeout:40000});
                const reject=page.getByRole('button',{name:'Reject all',exact:true});
                if(await reject.count()) await reject.first().click();
                await page.waitForTimeout(8000);
                const result={name,lat,lng,url:page.url(),text:(await page.locator('body').innerText()).slice(0,3000)};
                console.log('STREET RESULT',JSON.stringify(result));
                results.push(result);
                await page.screenshot({path:`${name}.png`});
                if(name==='north'){
                  await page.goto(`https://www.google.com/maps/embed?pb=!4v1!6m8!1m7!1s!2m2!1d${lat}!2d${lng}!3f155!4f0!5f0.7820865974627469`,{waitUntil:'domcontentloaded',timeout:40000});
                  await page.waitForTimeout(8000);
                  console.log('COORDINATE EMBED',(await page.locator('body').innerText()).slice(0,2000));
                  await page.screenshot({path:'coordinate-embed.png'});
                }
              }catch(e){console.log('STREET ERROR',name,e.message)}
              await page.close();
            }
            fs.writeFileSync('panoramas.json',JSON.stringify(results,null,2));
            const page=await context.newPage();
            try{
              await page.goto('https://www.mapillary.com/app/?lat=25.59097&lng=-108.47070&z=18',{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForTimeout(12000);
              console.log('MAPILLARY',(await page.locator('body').innerText()).slice(0,2500));
              await page.screenshot({path:'open-coverage.png'});
            }catch(e){console.log('OPEN COVERAGE ERROR',e.message)}
            await browser.close();
          })();
          JS
          node probe.cjs
          python - <<'PY'
          import urllib.request,urllib.parse
          url='https://api.openstreetcam.org/1.0/list/nearby-photos/'
          try:
            req=urllib.request.Request(url,data=urllib.parse.urlencode({'lat':25.59097,'lng':-108.47070,'radius':1000,'itemsPerPage':10}).encode())
            with urllib.request.urlopen(req,timeout=25) as r: raw=r.read().decode()
            print('KARTAVIEW NEARBY',raw[:10000]);open('kartaview.json','w').write(raw)
          except Exception as e: print('KARTAVIEW ERROR',str(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-check
          path: |
            /tmp/street-check/*.json
            /tmp/street-check/*.png
          retention-days: 2
