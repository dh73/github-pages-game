name: Cuatrimoto 92
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuatrimoto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Game rules, vehicle physics and continuous route
        run: |
          node --check game.js
          node --check route-renderer.mjs
          node --check engine-audio.mjs
          node --check radio.mjs
          node --test .github/tests/*.test.mjs
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps ${{ matrix.engine }} > /tmp/browser-install.log 2>&1 || { tail -80 /tmp/browser-install.log; exit 1; }
      - name: Native file diagnostic
        if: matrix.engine == 'webkit'
        run: python3 .github/tests/media-probe.py
      - name: Real WebGL, complete offline ride, multi-touch and nonzero audio
        run: python3 .github/tests/browser.py --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-${{ matrix.engine }}
          path: /tmp/cuatrimoto-shots/*.png
          retention-days: 3
