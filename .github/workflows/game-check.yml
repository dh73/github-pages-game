name: Cuatrimoto 92
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuatrimoto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Game rules and complete rides
        run: |
          node --check game.js
          node --test .github/tests/core.test.mjs
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps ${{ matrix.engine }}
      - name: Phone and tablet controls, progression, recovery and replay
        run: python3 .github/tests/browser.py --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-${{ matrix.engine }}
          path: /tmp/cuatrimoto-shots/*.png
          retention-days: 3
  street:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Complete the challenge against real Google street panoramas
        run: python3 .github/tests/browser.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-street-and-published-game
          path: /tmp/cuatrimoto-shots/*.png
          retention-days: 3
