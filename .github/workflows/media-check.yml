name: Radio media check
on:
  push:
    branches: [feat/smooth-ride-radio]
    paths: [.github/workflows/media-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify official radio recordings
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          for video in ['BJhj7KrrPSg','1wauorb3vyg','4GufI9pKWFI','FrNTpDH5ruQ','Yqpj6ig-OUc']:
            url='https://www.youtube.com/oembed?format=json&url='+urllib.parse.quote('https://www.youtube.com/watch?v='+video,safe='')
            with urllib.request.urlopen(url,timeout=15) as response: data=json.load(response)
            assert data['author_name']=='ValentinElizaldeVEVO',data
            print(video,data['title'],data['author_name'])
      - name: Package exact source for offline mobile regression testing
        run: git archive HEAD -o /tmp/game-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: game-source
          path: /tmp/game-source.tar
          retention-days: 1
