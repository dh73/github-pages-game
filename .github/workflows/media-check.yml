name: Radio media check
on:
  push:
    branches: [feat/smooth-ride-radio]
    paths: [.github/workflows/media-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Find and verify embeddable official recordings without downloading media
        shell: python
        run: |
          import concurrent.futures, json, re, urllib.request, urllib.parse
          pages = [
            'https://www.elimparcial.com/espectaculos/2025/02/02/estas-son-las-5-canciones-mas-escuchadas-de-valentin-elizalde-en-plataformas-digitales/',
            'https://acironline.mx/entretenimiento/musica/latina/recordemos-a-valentin-elizalde-con-sus-mejores-canciones/',
            'https://hellomusictheory.com/learn/best-mexican-songs/'
          ]
          def text(url):
            req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=18) as response:
              return response.read(4000000).decode('utf-8','replace')
          ids = {'4GufI9pKWFI'}
          for url in pages:
            try:
              html = text(url).replace('\\/','/').replace('&amp;','&')
              found = set(re.findall(r'(?:youtube(?:-nocookie)?\.com/(?:embed/|watch\?v=)|youtu\.be/)([A-Za-z0-9_-]{11})',html))
              print('Embedded music candidates:', len(found), 'source:', url)
              ids.update(found)
            except Exception as error:
              print(type(error).__name__, 'while checking source:', url)
          def verify(video):
            try:
              url = 'https://www.youtube.com/oembed?format=json&url=' + urllib.parse.quote('https://www.youtube.com/watch?v='+video,safe='')
              data = json.loads(text(url))
              if 'elizalde' in (data.get('author_name','')+' '+data.get('title','')).lower():
                print(json.dumps({key:data.get(key) for key in ['title','author_name','author_url']} | {'video':video},ensure_ascii=False))
            except Exception as error:
              print(type(error).__name__, 'while checking oEmbed:', video)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            list(pool.map(verify, sorted(ids)[:40]))
